<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <style>
      .box {
        height: 100px;
        background-color: #7952b3;
        border: 1px solid white;
        color: white;
      }
      .box-auto {
        border: 1px solid white;
        background-color: #7952b3;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container mt-3">
      <!-- 排序 -->
      <div class="row">
        <div class="col-3 order-2">
          <div class="box">1</div>
        </div>
        <div class="col-3 order-1">
          <div class="box">2</div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-3 order-sm-1">
          <div class="box">1</div>
        </div>
        <div class="col-sm-3 order-sm-3">
          <div class="box">2</div>
        </div>
        <div class="col-sm-6 order-sm-2">
          <div class="box">3</div>
        </div>
      </div>

      <hr />
      <!-- align-content -->
      <div
        class="d-flex flex-wrap align-content-end bg-secondary"
        style="height: 300px"
      >
        <div class="col-sm-3 box-auto">1</div>
        <div class="col-sm-3 box-auto">2</div>
        <div class="col-sm-3 box-auto">3</div>
        <div class="col-sm-3 box-auto">4</div>
        <div class="col-sm-3 box-auto">5</div>
        <div class="col-sm-3 box-auto">6</div>
      </div>
    </div>
  </body>
</html>
